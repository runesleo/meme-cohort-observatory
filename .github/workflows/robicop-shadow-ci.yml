name: Robicop shadow CI

on:
  push:
    branches:
      - 'feat/robicop-shadow-replay-20260909'
    paths:
      - 'src/meme_cohort_observatory/robicop_shadow.py'
      - 'tests/test_robicop_shadow.py'
      - 'tests/fixtures/robicop_shadow_golden.json'
      - 'scripts/replay_robicop_shadow.py'
      - 'docs/ROBICOP_SHADOW.md'
      - '.github/workflows/robicop-shadow-ci.yml'
  pull_request:
    paths:
      - 'src/meme_cohort_observatory/robicop_shadow.py'
      - 'tests/test_robicop_shadow.py'
      - 'tests/fixtures/robicop_shadow_golden.json'
      - 'scripts/replay_robicop_shadow.py'
      - 'docs/ROBICOP_SHADOW.md'
      - '.github/workflows/robicop-shadow-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Shadow unit tests
        run: python -m pytest tests/test_robicop_shadow.py -q

      - name: Golden replay
        run: python scripts/replay_robicop_shadow.py --output /tmp/robicop-shadow-replay.json

      - name: Verify shadow-only invariants
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/robicop-shadow-replay.json'))
          assert report['mode'] == 'shadow_only'
          assert report['case_count'] == 7
          assert report['invariants']['canonical_mutations'] == 0
          assert report['invariants']['promotions'] == 0
          assert report['invariants']['trade_authorizations'] == 0
          assert report['invariants']['clear_verdict_means_safe'] is False
          print(json.dumps(report['class_counts'], sort_keys=True))
          PY
